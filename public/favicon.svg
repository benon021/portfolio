<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3344"/>
      <stop offset="100%" stop-color="#cc1122"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff2d3a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#bg)" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Code brackets / monogram design -->
  <path d="M 28 36 L 19 50 L 28 64" fill="none" stroke="#ff3344" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 72 36 L 81 50 L 72 64" fill="none" stroke="#ff3344" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- BP Monogram Text -->
  <text x="50" y="58" font-family="'Poppins', system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">BP</text>
</svg>
